<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Filtrar Lista</title>
</head>
<body>
    <h1>Filtrar Lista</h1>

    <p>Digite um nome para filtrar a lista</p>
    <input type="text" id="filtro" onkeyup="filtrar()" placeholder="Digite um nome...">

    <ul id="lista">
        <li>João</li>
        <li>Márcio</li>
        <li>Fabiana</li>
        <li>Jorge</li>
        <li>Silvana</li>
        <li>Luiz</li>
        <li>Carlos</li>
        <li>Pablo</li>
    </ul>

    <script>
        function filtrar() {
            var texto = document.getElementById('filtro').value.toLowerCase()
            var itens = document.getElementsByTagName('li')

            for (var i = 0; i < itens.length; i++) {
                var nome = itens[i].innerText.toLowerCase()

                if (nome.indexOf(texto) > -1) {
                    itens[i].style.display = ''
                } else {
                    itens[i].style.display = 'none'
                }
            }
        }
    </script>
</body>
</html>
